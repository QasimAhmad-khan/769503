# ONE local Phi inference server shared by all four roles (screener, analyzer, decision_maker, risk_analyst).
# UNVERIFIED in the build container (no GPU, no Hugging Face egress). Binds to loopback only.
# There is no second model: no Jev/Open-Jev or any other decision service.
services:
  phi:
    # Microsoft Phi-4-mini-instruct (MIT) behind vLLM's OpenAI-compatible server with structured outputs.
    image: vllm/vllm-openai:${VLLM_TAG:?pin a tested vLLM image tag or digest}
    command: >
      --model microsoft/Phi-4-mini-instruct
      --revision ${PHI_REVISION:?set PHI_REVISION to a pinned commit}
      --max-model-len 4096
      --max-num-seqs 1
      --gpu-memory-utilization ${PHI_GPU_UTIL:-0.35}
      --host 0.0.0.0 --port 8000
    ports: ["127.0.0.1:8000:8000"]
    deploy:
      replicas: 1
      resources:
        reservations:
          devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]
    restart: unless-stopped
