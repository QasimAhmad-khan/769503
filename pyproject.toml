[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-quant-crypto"
version = "0.1.0"
description = "Paper-only evidence-driven perpetual-futures research system: one Phi service (3 roles), Open-Jev candidate selection, deterministic risk/execution"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "jsonschema>=4.20"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
cqc = "cqc.__main__:main"

[tool.setuptools]
packages = ["cqc", "cqc.llm"]

[tool.setuptools.package-data]
cqc = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
